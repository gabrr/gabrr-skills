<script>
const icons={ai:'<rect x="4" y="6" width="16" height="14" rx="4"/><path d="M12 2v4M2 11h2m16 0h2M8 16h8"/><circle cx="8" cy="11" r="1"/><circle cx="16" cy="11" r="1"/>',tool:'<path d="M14 5a5 5 0 0 0-6 6l-5 5a2 2 0 0 0 3 3l5-5a5 5 0 0 0 6-6l-3 3-3-3 3-3Z"/>',data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>',rule:'<path d="m12 2 10 10-10 10L2 12Z"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5m0 3v1"/>',output:'<path d="M4 3h16v18H4zM8 8h8M8 12h8M8 16h5"/>',error:'<path d="m12 2 10 19H2L12 2Z M12 8v6m0 3v1"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]||icons.ai}</svg>`;
const config=JSON.parse(document.getElementById('flow-config').textContent);
document.title=config.title||'Workflow';
const nodes=config.nodes.map(n=>({...n,cx:n.x,cy:n.y}));
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges=config.edges;
const paths=Object.fromEntries(config.scenarios.map(s=>[s.id,s.path]));
const scenarios=Object.fromEntries(config.scenarios.map(s=>[s.id,s]));

function port(n,side){if(side==='left')return [n.x,n.cy];if(side==='right')return [n.x+n.w,n.cy];if(side==='top')return [n.cx,n.y];return [n.cx,n.y+n.h]}
function route(edge){const s=byId[edge.from],t=byId[edge.to];
const horizontal=s.cy===t.cy,right=t.cx>s.cx,down=t.cy>s.cy;
const source=edge.sourcePort||(horizontal?(right?'right':'left'):(down?'bottom':'top'));
const target=edge.targetPort||(horizontal?(right?'left':'right'):(down?'top':'bottom'));
const start=port(s,source),end=port(t,target);
const via=edge.via||(horizontal||s.cx===t.cx?[]:[[start[0],(start[1]+end[1])/2],[end[0],(start[1]+end[1])/2]]);
return 'M'+[start,...via,end].map(point=>point.join(' ')).join(' L');}
const edgeMap={};const svgNS='http://www.w3.org/2000/svg';
for(const edge of edges){const {from:a,to:b,kind,label,labelX:lx,labelY:ly}=edge;const p=document.createElementNS(svgNS,'path');p.id=`e-${a}-${b}`;p.setAttribute('class','edge '+(kind||''));p.setAttribute('marker-end','url(#arrow)');document.getElementById('edges').append(p);edgeMap[`${a}-${b}`]=p;if(label){const l=document.createElementNS(svgNS,'text');l.setAttribute('x',lx);l.setAttribute('y',ly);l.setAttribute('class','edge-label');l.textContent=label;document.getElementById('labels').append(l)}}
for(const {x,y,text} of config.labels||[]){const t=document.createElementNS(svgNS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','edge-label');t.textContent=text;document.getElementById('labels').append(t)}
const kindNames={data:'Data',ai:'Paid AI',agent:'Paid AI + web',tool:'Tool / code',rule:'Decision / code',output:'Output',error:'Error / code'};
for(const n of nodes){const b=document.createElement('button');b.className='node '+n.kind;b.id='n-'+n.id;b.setAttribute('aria-label',n.title+' — '+kindNames[n.kind]+'. Expand example data');const meta=document.createElement('span');meta.className='meta';meta.innerHTML=icon(n.kind);meta.append(document.createTextNode(kindNames[n.kind]));const expand=document.createElement('span');expand.className='expand';expand.setAttribute('aria-hidden','true');expand.textContent='↗';const title=document.createElement('strong');title.textContent=n.title;const subtitle=document.createElement('small');subtitle.textContent=n.subtitle||'';if(!n.subtitle)subtitle.hidden=true;b.append(meta,expand,title,subtitle);b.onclick=()=>inspect(n.id);document.getElementById('board').append(b)}
function layoutNodes(){
for(const n of nodes){const el=document.getElementById('n-'+n.id);n.w=el.offsetWidth||166;n.h=el.offsetHeight||76;n.x=n.cx-n.w/2;n.y=n.cy-n.h/2;el.style.left=n.x+'px';el.style.top=n.y+'px'}
for(const edge of edges)edgeMap[edge.from+'-'+edge.to].setAttribute('d',route(edge));
}
layoutNodes();
document.getElementById('legend').innerHTML=[['ai','Paid AI'],['tool','Tool / code'],['data','Data'],['rule','Branch']].map(([k,v])=>`<span>${icon(k)}${v}</span>`).join('');
const $=id=>document.getElementById(id);let currentInspector=null;
function resolveData(value){if(Array.isArray(value))return value.map(resolveData);if(value&&typeof value==='object'){if(Object.keys(value).length===1&&Object.hasOwn(value,'$ref'))return resolveData(config.samples[value.$ref]);return Object.fromEntries(Object.entries(value).map(([key,item])=>[key,resolveData(item)]))}return value}
function inspect(id){pause();const n=byId[id];lastFocus=document.activeElement;currentInspector=id;$('inspect-kind').textContent=kindNames[n.kind];$('inspect-title').textContent=n.title;$('inspect-description').textContent=n.description;$('inspect-input').textContent=n.input;$('inspect-output').textContent=n.output;$('inspect-data').textContent=JSON.stringify(resolveData(Object.hasOwn(scenarios[flow].data||{},id)?scenarios[flow].data[id]:n.data??null),null,2);$('inspect-note').textContent=n.note;$('copy').textContent='Copy JSON';$('veil').hidden=false;$('inspector').classList.add('open');$('inspector').setAttribute('aria-hidden','false');document.body.classList.add('modal-open');document.querySelectorAll('.node').forEach(b=>b.classList.toggle('selected',b.id==='n-'+id));$('close').focus()}
function closeInspector(){$('inspector').classList.remove('open');$('inspector').setAttribute('aria-hidden','true');$('veil').hidden=true;document.body.classList.remove('modal-open');currentInspector=null;document.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));lastFocus?.focus()}
$('close').onclick=closeInspector;$('veil').onclick=closeInspector;
document.addEventListener('keydown',e=>{if(!currentInspector)return;if(e.key==='Escape')closeInspector();if(e.key==='Tab'){let list=[...$('inspector').querySelectorAll('button,a,input,[tabindex="0"]')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('inspect-data').textContent);$('copy').textContent='Copied'}catch{$('copy').textContent='Select text to copy'}};
function pause(){playing=false;cancelAnimationFrame(raf);raf=0;$('play').textContent=index===paths[flow].length-1?'↺':'▶';$('particle').setAttribute('visibility','hidden')}
function illuminate(a,b){const e=edgeMap[a+'-'+b];if(e){e.classList.add('lit');e.setAttribute('marker-end','url(#arrow-on)')}}
function render(){let p=paths[flow];document.querySelectorAll('.node').forEach(n=>n.classList.remove('current','done'));Object.values(edgeMap).forEach(e=>{e.classList.remove('lit');e.setAttribute('marker-end','url(#arrow)')});for(let i=0;i<=index;i++){const id=p[i];$('n-'+id).classList.add(i===index?'current':'done');if(i)illuminate(p[i-1],id);for(const edge of edges)if(edge.kind==='payload'&&edge.to===id)illuminate(edge.from,edge.to)}$('step-count').textContent=index<0?'Ready':`${index+1} / ${p.length}`;$('status-text').textContent=index<0?(config.readyText||'Ready'):(byId[p[index]].narration||byId[p[index]].title);$('progress').style.width=((index+1)/p.length*100)+'%';$('back').disabled=index<0;$('step').disabled=index===p.length-1;if(index>=0&&$('follow').checked){const n=byId[p[index]],v=$('viewport');const y=n.y*scale,x=n.x*scale;if(y<v.scrollTop||y+n.h*scale>v.scrollTop+v.clientHeight)v.scrollTo({top:Math.max(0,y-v.clientHeight*.35),left:v.scrollLeft,behavior:'instant'});if(x<v.scrollLeft||x+n.w*scale>v.scrollLeft+v.clientWidth)v.scrollLeft=Math.max(0,x-v.clientWidth*.35)}}
function tick(now){if(!playing)return;if(!started)started=now;const duration=Number($('speed').value),delta=now-started;const p=paths[flow];if(delta>=duration){index=(index+1)%p.length;started=now;elapsed=0;$('particle').setAttribute('visibility','hidden');render()}else{elapsed=delta;let from=p[index],to=p[index+1],edge=edgeMap[from+'-'+to];if(edge&&!reduced.matches){const point=edge.getPointAtLength(edge.getTotalLength()*Math.min(1,delta/duration));$('particle').setAttribute('cx',point.x);$('particle').setAttribute('cy',point.y);$('particle').setAttribute('visibility','visible')}else $('particle').setAttribute('visibility','hidden')}raf=requestAnimationFrame(tick)}
$('play').onclick=()=>{if(playing){pause();return}if(index>=paths[flow].length-1){index=-1;elapsed=0}if(index<0){index=0;render()}playing=true;started=performance.now()-elapsed;$('play').textContent='Ⅱ';raf=requestAnimationFrame(tick)};
$('step').onclick=()=>{pause();index=Math.min(index+1,paths[flow].length-1);elapsed=0;render()};$('back').onclick=()=>{pause();index=Math.max(-1,index-1);elapsed=0;render()};$('reset').onclick=()=>{pause();index=-1;elapsed=0;render();$('viewport').scrollTo(0,0)};
document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{pause();flow=b.dataset.flow;index=-1;elapsed=0;document.querySelectorAll('[data-flow]').forEach(el=>el.setAttribute('aria-pressed',el===b));render();$('viewport').scrollTo(0,0)});
let fit=false;function zoom(){const width=config.board?.width||1180,height=config.board?.height||1040;const fitScale=Math.min(1,($('viewport').clientWidth-16)/width,($('viewport').clientHeight-10)/height);scale=fit?fitScale:Math.min(1,fitScale*(config.board?.scale||1));$('board').style.width=width+'px';$('board').style.height=height+'px';$('wires').setAttribute('viewBox',`0 0 ${width} ${height}`);$('wires').style.width=width+'px';$('wires').style.height=height+'px';$('board').style.transform=`scale(${scale})`;$('board-wrap').style.width=width*scale+'px';$('board-wrap').style.height=height*scale+'px';$('zoom').textContent='⛶';$('zoom').title=fit?'Enlarge flow':'Fit entire flow'}$('zoom').onclick=()=>{fit=!fit;zoom()};addEventListener('resize',()=>{layoutNodes();zoom()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});reduced.addEventListener('change',()=>{$('particle').setAttribute('visibility','hidden')});zoom();render();

const themeToggle=$('theme-toggle');
function setTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeToggle.setAttribute('aria-pressed',String(dark));themeToggle.title=dark?'Switch to light mode':'Switch to dark mode';themeToggle.setAttribute('aria-label',themeToggle.title)}
let savedTheme;try{savedTheme=localStorage.getItem('acetate-flow-theme')}catch{}
setTheme(savedTheme==='dark'||savedTheme==='light'?savedTheme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
themeToggle.onclick=()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(theme);try{localStorage.setItem('acetate-flow-theme',theme)}catch{}};
</script></body></html>
